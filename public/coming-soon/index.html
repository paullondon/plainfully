<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Plainfully — Coming Soon</title>
  <meta name="description" content="Something big is coming. Watch this space." />

  <!-- If you already have these, keep these paths. Otherwise adjust to your real CSS locations. -->
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/components/cards.css" />

  <style>
    /* ============================================================
       Coming Soon Page (self-contained polish)
       - Uses your theme tokens when present
       - Safe fallbacks when tokens aren't loaded
       ============================================================ */

    :root{
      --pf-bg: #0b0f14;
      --pf-surface: rgba(17,24,39,0.70);
      --pf-border: rgba(255,255,255,0.10);
      --pf-text: #e5e7eb;
      --pf-text-muted: rgba(229,231,235,0.72);

      --pf-brand: #2c6f63;
      --pf-accent: #ce9f77;

      --glow-a: rgba(44,111,99,0.45);
      --glow-b: rgba(206,159,119,0.35);

      --radius: 18px;
      --shadow: 0 20px 70px rgba(0,0,0,0.45);
      --shadow-soft: 0 10px 40px rgba(0,0,0,0.28);
    }

    html, body { height: 100%; }

    body{
      margin: 0;
      background: radial-gradient(1200px 800px at 20% 10%, rgba(44,111,99,0.22), transparent 60%),
                  radial-gradient(900px 600px at 80% 20%, rgba(206,159,119,0.18), transparent 55%),
                  radial-gradient(900px 700px at 50% 85%, rgba(44,111,99,0.16), transparent 60%),
                  var(--pf-bg);
      color: var(--pf-text);
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .wrap{
      width: 100%;
      max-width: 980px;
      display: grid;
      gap: 18px;
      align-items: center;
    }

    .shell{
      position: relative;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid var(--pf-border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* Animated glow blobs */
    .shell::before,
    .shell::after{
      content:"";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 30% 35%, var(--glow-a) 0%, transparent 55%),
        radial-gradient(circle at 70% 60%, var(--glow-b) 0%, transparent 55%);
      filter: blur(18px);
      opacity: 0.9;
      transform: translate3d(0,0,0);
      animation: drift 10s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .shell::after{
      opacity: 0.65;
      animation-duration: 13s;
      animation-direction: alternate-reverse;
    }

    @keyframes drift{
      from { transform: translate3d(-2%, -1%, 0) scale(1.02); }
      to   { transform: translate3d( 2%,  1%, 0) scale(1.06); }
    }

    .content{
      position: relative;
      padding: clamp(22px, 4vw, 40px);
      display: grid;
      gap: 18px;
    }

    header{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand{
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      min-height: 44px; /* accessibility touch target */
    }

    .logo{
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
    }

    /* Your logo path (per your rule): /public/assets/img */
    .logo img{
      width: 44px;
      height: 44px;
      object-fit: contain;
      display: block;
    }

    .brand-name{
      font-weight: 700;
      letter-spacing: 0.2px;
      font-size: 16px;
      line-height: 1.1;
    }

    .pill{
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--pf-border);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.18);
      box-shadow: var(--shadow-soft);
      color: var(--pf-text-muted);
      font-size: 13px;
    }

    .dot{
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--pf-accent);
      box-shadow: 0 0 0 6px rgba(206,159,119,0.12);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse{
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50%      { transform: scale(1.35); opacity: 1; }
    }

    h1{
      margin: 0;
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 1.03;
      letter-spacing: -0.6px;
    }

    .sub{
      margin: 0;
      max-width: 62ch;
      color: var(--pf-text-muted);
      font-size: clamp(15px, 1.6vw, 18px);
      line-height: 1.55;
    }

    .emphasis{
      background: linear-gradient(90deg, rgba(44,111,99,0.9), rgba(206,159,119,0.9));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .meta{
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .chip{
      border: 1px solid var(--pf-border);
      background: rgba(0,0,0,0.14);
      color: var(--pf-text-muted);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1;
    }

    footer{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 14px;
      margin-top: 6px;
      color: var(--pf-text-muted);
      font-size: 13px;
    }

    .link{
      color: inherit;
      text-decoration: none;
      border-bottom: 1px dashed rgba(229,231,235,0.35);
    }
    .link:focus,
    .link:hover{
      border-bottom-color: rgba(229,231,235,0.85);
      outline: none;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce){
      .shell::before, .shell::after, .dot { animation: none !important; }
    }
  </style>
</head>

<body>
  <main class="wrap" aria-label="Coming soon page">
    <section class="shell" role="region" aria-label="Plainfully coming soon">
      <div class="content">
        <header>
          <a class="brand" href="/" aria-label="Plainfully home">
            <span class="logo" aria-hidden="true">
              <img src="/assets/img/plainfully-logo.svg" alt="" />
            </span>
            <span class="brand-name">Plainfully</span>
          </a>

          <div class="pill" aria-label="Status">
            <span class="dot" aria-hidden="true"></span>
            <span>In the workshop</span>
          </div>
        </header>

        <div>
          <h1><span class="emphasis">Something big</span> is coming.</h1>
          <p class="sub">
            We’re building something calm, sharp, and genuinely useful.
            <strong>Watch this space.</strong>
          </p>

          <div class="meta" aria-label="Highlights">
            <span class="chip">Simple</span>
            <span class="chip">Fast</span>
            <span class="chip">Privacy-first</span>
          </div>
        </div>

        <footer>
          <span>© <span id="y"></span> Plainfully</span>
          <span>
            <a class="link" href="/help">Help</a>
          </span>
        </footer>
      </div>
    </section>
  </main>

  <script>
    // Set year safely (no user input; no risk).
    document.getElementById('y').textContent = String(new Date().getFullYear());
  </script>
</body>
</html>
